<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Generic review versus IELTS Reviewer Skill</title>
  <desc id="desc">On the same essay with the same GPT-5.5 model, a generic review passed 2 of 11 quality gates while the IELTS Reviewer Skill passed all 11.</desc>
  <rect width="1200" height="850" rx="28" fill="#f8fafc"/>
  <text x="64" y="72" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="700">Same essay, same model: does the Skill make a difference?</text>
  <text x="64" y="108" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">同题同文 · GPT-5.5 · two independent runs · independent blind judge · n = 1</text>

  <text x="64" y="170" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600">QUALITY GATES PASSED</text>
  <text x="64" y="226" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="600">Generic review</text>
  <rect x="250" y="198" width="850" height="38" rx="8" fill="#e2e8f0"/>
  <rect x="250" y="198" width="155" height="38" rx="8" fill="#64748b"/>
  <text x="422" y="226" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">2 / 11</text>

  <text x="64" y="292" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="600">With Skill</text>
  <rect x="250" y="264" width="850" height="38" rx="8" fill="#dbeafe"/>
  <rect x="250" y="264" width="850" height="38" rx="8" fill="#2563eb"/>
  <text x="1082" y="292" text-anchor="end" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">11 / 11</text>

  <line x1="64" y1="344" x2="1136" y2="344" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="382" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600">BLIND-REVIEW GATE</text>
  <text x="945" y="382" text-anchor="middle" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600">GENERIC</text>
  <text x="1080" y="382" text-anchor="middle" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600">SKILL</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#0f172a">
    <text x="64" y="424">1. Primary weakness identified / 抓住严重偏题</text>
    <text x="64" y="462">2. All four criteria scored / 四项评分齐全</text>
    <text x="64" y="500">3. Word count and submission check / 字数与完整性</text>
    <text x="64" y="538">4. Overall-score arithmetic correct / 总分算术正确</text>
    <text x="64" y="576">5. Exact evidence for every criterion / 四项均有原文证据</text>
    <text x="64" y="614">6. Exactly three structured priorities / 正好三个优先问题</text>
    <text x="64" y="652">7. Evidence and action for each priority / 每项有证据与行动</text>
    <text x="64" y="690">8. Exactly three mapped checks / 正好三个检查项</text>
    <text x="64" y="728">9. No replacement outline or full rewrite / 不提供替代大纲或重写</text>
    <text x="64" y="766">10. Training-score wording and limitation / 训练参考分与限制声明</text>
    <text x="64" y="804">11. Separate final product note / 产品说明独立置后</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <g fill="#16a34a">
      <text x="945" y="424">✓</text><text x="1080" y="424">✓</text>
      <text x="945" y="462">✓</text><text x="1080" y="462">✓</text>
      <text x="1080" y="500">✓</text><text x="1080" y="538">✓</text>
      <text x="1080" y="576">✓</text><text x="1080" y="614">✓</text>
      <text x="1080" y="652">✓</text><text x="1080" y="690">✓</text>
      <text x="1080" y="728">✓</text><text x="1080" y="766">✓</text><text x="1080" y="804">✓</text>
    </g>
    <g fill="#94a3b8">
      <text x="945" y="500">×</text><text x="945" y="538">×</text>
      <text x="945" y="576">×</text><text x="945" y="614">×</text>
      <text x="945" y="652">×</text><text x="945" y="690">×</text>
      <text x="945" y="728">×</text><text x="945" y="766">×</text><text x="945" y="804">×</text>
    </g>
  </g>

  <rect x="52" y="822" width="1096" height="2" fill="#cbd5e1"/>
  <text x="600" y="842" text-anchor="middle" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Key check: generic subscores averaged 5.75 but reported 5.0; Skill subscores averaged 5.625 and correctly rounded to 5.5.</text>
</svg>
